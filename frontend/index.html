<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabTrack - University Computer Lab Management</title>
    <!-- Vendored React 18 & Babel for fast local offline execution -->
    <script src="/static/js/react.production.min.js"></script>
    <script src="/static/js/react-dom.production.min.js"></script>
    <script src="/static/js/babel.min.js"></script>
    <link rel="stylesheet" href="/static/css/portal.css">
    <!-- Animation & Micro-interaction Engines (Anime.js & Motion.dev) -->
    <script src="/static/js/anime.min.js"></script>
    <script src="/static/js/motion.umd.js"></script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            // Authentication state
            const [token, setToken] = useState(localStorage.getItem('labtrack_token') || '');
            const [currentUser, setCurrentUser] = useState(() => {
                try {
                    return JSON.parse(localStorage.getItem('labtrack_user')) || null;
                } catch(e) {
                    return null;
                }
            });

            // Active Tab
            const [activeTab, setActiveTab] = useState('grid');
            const [showAuthModal, setShowAuthModal] = useState(false);

            // Live Data
            const [labs, setLabs] = useState([]);
            const [workstations, setWorkstations] = useState([]);
            const [selectedLabId, setSelectedLabId] = useState('all');
            const [loadingGrid, setLoadingGrid] = useState(false);

            // My Reservations
            const [myReservations, setMyReservations] = useState([]);
            const [loadingReservations, setLoadingReservations] = useState(false);

            // Faculty Sessions
            const [facultySessions, setFacultySessions] = useState([]);

            // Clubs
            const [clubs, setClubs] = useState([]);
            const [clubEvents, setClubEvents] = useState([]);

            // Alert messages
            const [globalMsg, setGlobalMsg] = useState(null);

            // Validate token on mount
            useEffect(() => {
                const savedToken = localStorage.getItem('labtrack_token');
                if (savedToken) {
                    fetch('/api/auth/me', {
                        headers: { 'Authorization': `Bearer ${savedToken}` }
                    })
                    .then(res => {
                        if (!res.ok) {
                            setToken('');
                            setCurrentUser(null);
                            localStorage.removeItem('labtrack_token');
                            localStorage.removeItem('labtrack_user');
                        } else {
                            return res.json();
                        }
                    })
                    .then(userData => {
                        if (userData) {
                            setCurrentUser(userData);
                            localStorage.setItem('labtrack_user', JSON.stringify(userData));
                            if (userData.role === 'faculty') {
                                setActiveTab('faculty');
                            }
                        }
                    })
                    .catch(() => {
                        setToken('');
                        setCurrentUser(null);
                        localStorage.removeItem('labtrack_token');
                        localStorage.removeItem('labtrack_user');
                    });
                } else {
                    setToken('');
                    setCurrentUser(null);
                    localStorage.removeItem('labtrack_user');
                }
            }, []);

            // Initial load & Polling
            useEffect(() => {
                fetchLabs();
                fetchWorkstations();
                const interval = setInterval(() => {
                    fetchWorkstations();
                }, 4000);
                return () => clearInterval(interval);
            }, [selectedLabId]);

            useEffect(() => {
                if (token && currentUser) {
                    if (activeTab === 'reservations') fetchMyReservations();
                    if (activeTab === 'faculty' || activeTab === 'sessions') fetchFacultySessions();
                    if (activeTab === 'clubs' || activeTab === 'admin') fetchClubData();
                }
            }, [activeTab, token, currentUser]);

            // Enforce role-based tab access
            useEffect(() => {
                if (currentUser && currentUser.role === 'faculty') {
                    if (activeTab === 'booking' || activeTab === 'reservations' || activeTab === 'clubs' || activeTab === 'admin') {
                        setActiveTab('faculty');
                    }
                }
            }, [currentUser, activeTab]);

            const notify = (type, text) => {
                setGlobalMsg({ type, text });
                setTimeout(() => setGlobalMsg(null), 5000);
            };

            const fetchLabs = async () => {
                try {
                    const res = await fetch('/api/pcs/labs');
                    if (res.ok) {
                        const data = await res.json();
                        setLabs(data);
                    }
                } catch(e) {
                    console.error("Failed to load labs", e);
                }
            };

            const fetchWorkstations = async () => {
                try {
                    const url = selectedLabId === 'all' ? '/api/pcs' : `/api/pcs?lab_id=${selectedLabId}`;
                    const res = await fetch(url);
                    if (res.ok) {
                        const data = await res.json();
                        setWorkstations(data);
                    }
                } catch(e) {
                    console.error("Failed to load workstations", e);
                }
            };

            const fetchMyReservations = async () => {
                if (!token || !currentUser || currentUser.role === 'faculty') return;
                setLoadingReservations(true);
                try {
                    const res = await fetch('/api/reservations/my', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setMyReservations(data);
                    }
                } catch(e) {
                    console.error("Failed to fetch my reservations", e);
                } finally {
                    setLoadingReservations(false);
                }
            };

            const fetchFacultySessions = async () => {
                if (!token || !currentUser) return;
                try {
                    const res = await fetch('/api/faculty/my-sessions', {
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        const data = await res.json();
                        setFacultySessions(data);
                    }
                } catch(e) {
                    console.error("Failed to fetch faculty sessions", e);
                }
            };

            const fetchClubData = async () => {
                try {
                    const resClubs = await fetch('/api/clubs');
                    if (resClubs.ok) setClubs(await resClubs.json());
                    const resEvents = await fetch('/api/clubs/events');
                    if (resEvents.ok) setClubEvents(await resEvents.json());
                } catch(e) {
                    console.error("Failed to fetch club data", e);
                }
            };

            const handleLogin = (userData, userToken) => {
                setCurrentUser(userData);
                setToken(userToken);
                localStorage.setItem('labtrack_token', userToken);
                localStorage.setItem('labtrack_user', JSON.stringify(userData));
                setShowAuthModal(false);
                notify('success', `Signed in successfully as ${userData.name} (${userData.role})`);
                if (userData.role === 'faculty') {
                    setActiveTab('faculty');
                } else if (userData.role === 'admin') {
                    setActiveTab('admin');
                } else if (userData.role === 'club_lead') {
                    setActiveTab('clubs');
                } else {
                    setActiveTab('booking');
                }
            };

            const handleLogout = () => {
                setCurrentUser(null);
                setToken('');
                localStorage.removeItem('labtrack_token');
                localStorage.removeItem('labtrack_user');
                setMyReservations([]);
                setFacultySessions([]);
                notify('info', "Logged out from session");
                setActiveTab('grid');
            };

            const cancelBooking = async (id) => {
                if (!token || !currentUser) {
                    notify('danger', "Authentication required. Please sign in to cancel reservations.");
                    setShowAuthModal(true);
                    return;
                }
                if (!confirm(`Cancel reservation #${id}?`)) return;
                try {
                    const res = await fetch(`/api/reservations/${id}`, {
                        method: 'DELETE',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    if (res.ok) {
                        notify('success', `Reservation #${id} cancelled.`);
                        fetchMyReservations();
                        fetchWorkstations();
                    } else {
                        const err = await res.json();
                        notify('danger', err.detail || "Cancellation failed");
                    }
                } catch(e) {
                    notify('danger', "Network error while cancelling");
                }
            };

            const role = currentUser ? currentUser.role : 'guest';

            return (
                <div>
                    {/* Sticky Header & Navigation Wrapper */}
                    <div className="sticky-nav-container">
                        <header>
                            <div className="brand-group">
                                <div className="brand-logo-frame">
                                    <img src="/static/iiitk.jpeg" alt="IIITDM Kurnool" className="brand-logo-img" />
                                </div>
                                <div className="brand-text-block">
                                    <h1 className="brand-title">LABTRACK <span style={{ fontSize: '0.74rem', color: 'var(--text-muted)' }}>&bull; IIITDM KURNOOL</span></h1>
                                    <p className="brand-subtitle">Central Computing &amp; Academic Laboratories</p>
                                </div>
                            </div>

                            <div className="header-auth-bar">
                                {currentUser ? (
                                    <>
                                        <div className="user-pill">
                                            <span className={`role-badge role-${currentUser.role}`}>{currentUser.role}</span>
                                            <strong>{currentUser.name}</strong>
                                            <span style={{ color: 'var(--text-light)', fontSize: '0.78rem' }}>({currentUser.roll_no})</span>
                                        </div>
                                        <button className="btn btn-outline btn-sm" onClick={handleLogout}>Sign Out</button>
                                    </>
                                ) : (
                                    <>
                                        <span style={{ fontSize: '0.8rem', fontFamily: 'var(--font-mono)', color: 'var(--text-muted)', fontWeight: 600 }}>GUEST / WALK-IN</span>
                                        <button className="btn btn-sm" onClick={() => setShowAuthModal(true)}>Sign In</button>
                                    </>
                                )}
                            </div>
                        </header>

                        {/* Navigation Tabs */}
                        <nav>
                            <button className={`tab-btn ${activeTab === 'grid' ? 'active' : ''}`} onClick={() => setActiveTab('grid')}>
                                🖥️ Live Workstations
                            </button>
                            {role !== 'faculty' && (
                                <button className={`tab-btn ${activeTab === 'booking' ? 'active' : ''}`} onClick={() => setActiveTab('booking')}>
                                    📅 Book Workstation
                                </button>
                            )}
                            {role !== 'faculty' && (
                                <button className={`tab-btn ${activeTab === 'reservations' ? 'active' : ''}`} onClick={() => setActiveTab('reservations')}>
                                    🎟️ My Reservations
                                </button>
                            )}
                            {(role === 'faculty' || role === 'admin') && (
                                <>
                                    <button className={`tab-btn ${activeTab === 'faculty' ? 'active' : ''}`} onClick={() => setActiveTab('faculty')}>
                                        🎓 Faculty Extra Labs
                                    </button>
                                    <button className={`tab-btn ${activeTab === 'sessions' ? 'active' : ''}`} onClick={() => setActiveTab('sessions')}>
                                        📋 Scheduled Lab Sessions
                                    </button>
                                </>
                            )}
                            {(role === 'club_lead' || role === 'admin') && (
                                <button className={`tab-btn ${activeTab === 'clubs' ? 'active' : ''}`} onClick={() => setActiveTab('clubs')}>
                                    ⚡ Technical Clubs
                                </button>
                            )}
                            {role === 'admin' && (
                                <button className={`tab-btn ${activeTab === 'admin' ? 'active' : ''}`} onClick={() => setActiveTab('admin')}>
                                    ⚙️ Admin Operations
                                </button>
                            )}
                        </nav>
                    </div>

                    {/* Notification Toast */}
                    {globalMsg && (
                        <div style={{ maxWidth: '1400px', margin: '1rem auto 0 auto', padding: '0 2rem' }}>
                            <div className={`alert-box alert-${globalMsg.type}`}>
                                {globalMsg.text}
                            </div>
                        </div>
                    )}

                    {/* Main Content Area */}
                    <main>
                        {activeTab === 'grid' && (
                            <TabLiveGrid
                                labs={labs}
                                workstations={workstations}
                                selectedLabId={selectedLabId}
                                setSelectedLabId={setSelectedLabId}
                                onRefresh={fetchWorkstations}
                            />
                        )}

                        {activeTab === 'booking' && (
                            <TabBooking
                                token={token}
                                labs={labs}
                                workstations={workstations}
                                currentUser={currentUser}
                                setActiveTab={setActiveTab}
                                onBookingSuccess={() => {
                                    fetchWorkstations();
                                    setActiveTab('reservations');
                                }}
                                notify={notify}
                                openLogin={() => setShowAuthModal(true)}
                            />
                        )}

                        {activeTab === 'reservations' && (
                            <TabMyReservations
                                token={token}
                                currentUser={currentUser}
                                reservations={myReservations}
                                loading={loadingReservations}
                                setActiveTab={setActiveTab}
                                onCancel={cancelBooking}
                                onRefresh={fetchMyReservations}
                                openLogin={() => setShowAuthModal(true)}
                            />
                        )}

                        {activeTab === 'faculty' && (
                            <TabFaculty
                                token={token}
                                currentUser={currentUser}
                                labs={labs}
                                sessions={facultySessions}
                                onRefresh={() => {
                                    fetchFacultySessions();
                                    fetchWorkstations();
                                }}
                                onBookingSuccess={() => {
                                    fetchFacultySessions();
                                    fetchWorkstations();
                                    setActiveTab('sessions');
                                }}
                                onViewSessions={() => setActiveTab('sessions')}
                                notify={notify}
                                openLogin={() => setShowAuthModal(true)}
                            />
                        )}

                        {activeTab === 'sessions' && (
                            <TabScheduledSessions
                                token={token}
                                currentUser={currentUser}
                                labs={labs}
                                sessions={facultySessions}
                                onRefresh={() => {
                                    fetchFacultySessions();
                                    fetchWorkstations();
                                }}
                                notify={notify}
                                openLogin={() => setShowAuthModal(true)}
                                onScheduleNew={() => setActiveTab('faculty')}
                            />
                        )}

                        {activeTab === 'clubs' && (
                            <TabClubs
                                token={token}
                                currentUser={currentUser}
                                clubs={clubs}
                                events={clubEvents}
                                labs={labs}
                                onRefresh={() => {
                                    fetchClubData();
                                    fetchWorkstations();
                                }}
                                notify={notify}
                                openLogin={() => setShowAuthModal(true)}
                            />
                        )}

                        {activeTab === 'admin' && (
                            <TabAdmin
                                token={token}
                                events={clubEvents}
                                workstations={workstations}
                                onRefresh={() => {
                                    fetchClubData();
                                    fetchWorkstations();
                                }}
                                notify={notify}
                            />
                        )}
                    </main>

                    {/* Authentication Modal */}
                    {showAuthModal && (
                        <AuthModal
                            onClose={() => setShowAuthModal(false)}
                            onLoginSuccess={handleLogin}
                            notify={notify}
                        />
                    )}
                </div>
            );
        }

        /* TAB 1: LIVE WORKSTATION GRID */
        function TabLiveGrid({ labs, workstations, selectedLabId, setSelectedLabId, onRefresh }) {
            const availCount = workstations.filter(w => w.state === 'AVAILABLE').length;
            const heldCount = workstations.filter(w => w.state === 'HELD').length;
            const occCount = workstations.filter(w => w.state === 'OCCUPIED').length;
            const totalCount = workstations.length;
            const pctAvail = totalCount > 0 ? Math.round((availCount / totalCount) * 100) : 0;
            const pctHeld = totalCount > 0 ? Math.round((heldCount / totalCount) * 100) : 0;
            const pctOcc = totalCount > 0 ? Math.round((occCount / totalCount) * 100) : 0;

            useEffect(() => {
                if (window.anime) {
                    window.anime({
                        targets: '.pc-card',
                        translateY: [8, 0],
                        opacity: [0, 1],
                        delay: window.anime.stagger(10),
                        duration: 250,
                        easing: 'easeOutQuad'
                    });
                }
            }, [selectedLabId, workstations.length]);

            return (
                <div>
                    {/* Coconut UI & bklit UI Inspired Minimal Brutalist Statistical Command Strip */}
                    <div className="stats-grid">
                        <div className="stat-card">
                            <div className="stat-header">
                                <span className="stat-tag">● FLEET TOTAL</span>
                                <span className="stat-pct">{labs.length} LABS</span>
                            </div>
                            <div className="stat-value">{totalCount}<span className="stat-unit">PCs</span></div>
                            <div className="stat-desc">Campus computing workstations enrolled</div>
                        </div>

                        <div className="stat-card">
                            <div className="stat-header">
                                <span className="stat-tag stat-tag-avail">🟢 WALK-IN FREE</span>
                                <span className="stat-pct">{pctAvail}%</span>
                            </div>
                            <div className="stat-value">{availCount}<span className="stat-unit">PCs</span></div>
                            <div className="stat-desc">Ready for immediate student login</div>
                        </div>

                        <div className="stat-card">
                            <div className="stat-header">
                                <span className="stat-tag stat-tag-held">🔒 HELD / RESERVED</span>
                                <span className="stat-pct">{pctHeld}%</span>
                            </div>
                            <div className="stat-value">{heldCount}<span className="stat-unit">PCs</span></div>
                            <div className="stat-desc">Academic cohort &amp; club allocations</div>
                        </div>

                        <div className="stat-card">
                            <div className="stat-header">
                                <span className="stat-tag stat-tag-occ">⚡ IN ACTIVE USE</span>
                                <span className="stat-pct">{pctOcc}%</span>
                            </div>
                            <div className="stat-value">{occCount}<span className="stat-unit">PCs</span></div>
                            <div className="stat-desc">Active student sessions authenticated</div>
                        </div>
                    </div>

                    <div className="card">
                        <div className="card-header">
                            <div>
                                <h2 className="card-title">Live Laboratory Workstations</h2>
                                <p className="card-subtitle">
                                    Real-time workstation status &bull; {availCount} Available &bull; {heldCount} Reserved &bull; {occCount} Occupied
                                </p>
                            </div>
                            <button className="btn btn-outline btn-sm" onClick={onRefresh}>🔄 Refresh Grid</button>
                        </div>

                        {/* Lab filter chips */}
                        <div className="filter-row">
                            <button
                                className={`filter-chip ${selectedLabId === 'all' ? 'active' : ''}`}
                                onClick={() => setSelectedLabId('all')}
                            >
                                All Labs ({workstations.length} PCs)
                            </button>
                            {labs.map(lab => (
                                <button
                                    key={lab.id}
                                    className={`filter-chip ${selectedLabId === lab.id ? 'active' : ''}`}
                                    onClick={() => setSelectedLabId(lab.id)}
                                >
                                    {lab.name} ({lab.total_pcs} PCs)
                                </button>
                            ))}
                        </div>

                        {/* Workstation Grid Cards - ZERO VERTICAL BARS */}
                        <div className="grid-container">
                            {workstations.map(pc => {
                                const held = pc.held_info;
                                const occ = pc.active_session;

                                return (
                                    <div key={pc.id} className="pc-card">
                                        <div>
                                            <div className="pc-card-header">
                                                <div>
                                                    <div className="pc-name">{pc.hostname}</div>
                                                    <div className="pc-lab-sub">{pc.lab_name}</div>
                                                </div>
                                                <span className={`status-badge badge-${pc.state}`}>{pc.state}</span>
                                            </div>

                                            {/* Status Details */}
                                            {pc.state === 'AVAILABLE' && (
                                                <div className="pc-info-box">
                                                    <div className="pc-info-title" style={{ color: 'var(--status-avail-text)' }}>🟢 Free for Walk-in</div>
                                                    <div className="pc-info-text">Any student can sit and log in immediately.</div>
                                                </div>
                                            )}

                                            {pc.state === 'HELD' && held && (
                                                <div className="pc-info-box" style={{ backgroundColor: 'var(--status-held-bg)', borderColor: 'var(--status-held-border)' }}>
                                                    <div className="pc-info-title" style={{ color: 'var(--status-held-text)' }}>
                                                        {held.hold_type === 'club' ? '⚡ Club Workshop' :
                                                         held.hold_type === 'faculty' ? '🎓 Faculty Session' :
                                                         '🔒 Reserved'}
                                                    </div>
                                                    <div className="pc-info-text">
                                                        <strong>Reserver:</strong> {held.who}<br />
                                                        <strong>Purpose:</strong> {held.purpose}
                                                        {held.start_time && held.end_time ? (
                                                            <><br /><strong>Time:</strong> {new Date(held.start_time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} - {new Date(held.end_time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</>
                                                        ) : held.time_window ? (
                                                            <><br /><strong>Time:</strong> {held.time_window}</>
                                                        ) : null}
                                                    </div>
                                                </div>
                                            )}

                                            {pc.state === 'HELD' && !held && (
                                                <div className="pc-info-box" style={{ backgroundColor: 'var(--status-held-bg)', borderColor: 'var(--status-held-border)' }}>
                                                    <div className="pc-info-title" style={{ color: 'var(--status-held-text)' }}>🔒 Reserved</div>
                                                    <div className="pc-info-text">Workstation held for scheduled academic or club session.</div>
                                                </div>
                                            )}

                                            {pc.state === 'OCCUPIED' && occ && (
                                                <div className="pc-info-box" style={{ backgroundColor: 'var(--status-occ-bg)', borderColor: 'var(--status-occ-border)' }}>
                                                    <div className="pc-info-title" style={{ color: 'var(--status-occ-text)' }}>⚡ In Active Use</div>
                                                    <div className="pc-info-text">
                                                        <strong>User:</strong> {occ.student_name} ({occ.roll_no})<br />
                                                        <strong>Activity:</strong> {occ.purpose}
                                                        {occ.start_time && (
                                                            <><br /><strong>Since:</strong> {new Date(occ.start_time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}</>
                                                        )}
                                                    </div>
                                                </div>
                                            )}

                                            {pc.state === 'OCCUPIED' && !occ && (
                                                <div className="pc-info-box" style={{ backgroundColor: 'var(--status-occ-bg)', borderColor: 'var(--status-occ-border)' }}>
                                                    <div className="pc-info-title" style={{ color: 'var(--status-occ-text)' }}>⚡ In Active Use</div>
                                                    <div className="pc-info-text">Session actively running on this workstation.</div>
                                                </div>
                                            )}

                                            {pc.state === 'MAINTENANCE' && (
                                                <div className="pc-info-box">
                                                    <div className="pc-info-title" style={{ color: 'var(--status-maint-text)' }}>⚠️ Maintenance</div>
                                                    <div className="pc-info-text">{pc.maintenance_reason || 'Hardware diagnostics in progress.'}</div>
                                                </div>
                                            )}
                                        </div>

                                        {/* Hardware Specs & Telemetry */}
                                        <div>
                                            <div className="pc-specs-row">
                                                <span>{pc.specifications?.cpu || 'Core i7'} &bull; {pc.specifications?.ram_gb || 16}GB RAM</span>
                                                {pc.has_gpu && <span className="gpu-tag">GPU</span>}
                                            </div>
                                            {pc.latest_telemetry && pc.state === 'OCCUPIED' && (
                                                <div style={{ fontSize: '0.7rem', color: '#64748b', marginTop: '0.25rem', display: 'flex', justifyContent: 'space-between' }}>
                                                    <span>CPU: {pc.latest_telemetry.cpu_percent}%</span>
                                                    <span>RAM: {pc.latest_telemetry.memory_percent}%</span>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        }

        /* TAB 2: BOOK A WORKSTATION */
        function TabBooking({ token, labs, workstations, currentUser, setActiveTab, onBookingSuccess, notify, openLogin }) {
            const [labId, setLabId] = useState(1);
            const [pcId, setPcId] = useState('');
            const [purpose, setPurpose] = useState('');
            const [taskType, setTaskType] = useState('Practice');
            const [software, setSoftware] = useState([]);
            
            // Generate standard default times (e.g. now + 5 min to now + 2 hours)
            const getInitialStart = () => {
                const d = new Date(Date.now() + 5 * 60000);
                d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
                return d.toISOString().slice(0, 16);
            };
            const getInitialEnd = () => {
                const d = new Date(Date.now() + 125 * 60000);
                d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
                return d.toISOString().slice(0, 16);
            };

            const [startTime, setStartTime] = useState(getInitialStart);
            const [endTime, setEndTime] = useState(getInitialEnd);
            const [submitting, setSubmitting] = useState(false);

            if (!token) {
                return (
                    <div className="card" style={{ textAlign: 'center', padding: '3rem 2rem' }}>
                        <h2 className="card-title" style={{ marginBottom: '0.5rem' }}>Authentication Required</h2>
                        <p className="card-subtitle" style={{ marginBottom: '1.5rem' }}>
                            Please sign in with your university credentials to reserve a workstation slot.
                        </p>
                        <button className="btn" onClick={openLogin}>Sign In to Book</button>
                    </div>
                );
            }

            if (currentUser && currentUser.role === 'faculty') {
                return (
                    <div className="card" style={{ textAlign: 'center', padding: '3.5rem 2rem' }}>
                        <div style={{ fontSize: '2.5rem', marginBottom: '0.75rem' }}>👨‍🏫</div>
                        <h2 className="card-title" style={{ marginBottom: '0.5rem' }}>Faculty Account Notice</h2>
                        <p className="card-subtitle" style={{ maxWidth: '520px', margin: '0 auto 1.5rem auto' }}>
                            Faculty members do not reserve individual personal workstations. To allocate computer labs for student cohorts, please use the Faculty Extra Labs portal.
                        </p>
                        <button className="btn" onClick={() => setActiveTab && setActiveTab('faculty')}>Open Faculty Extra Labs</button>
                    </div>
                );
            }

            const labPcs = workstations.filter(pc => pc.lab_id === parseInt(labId));

            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!purpose.trim()) {
                    notify('danger', "Please enter the purpose / reason for booking.");
                    return;
                }

                setSubmitting(true);
                try {
                    const payload = {
                        lab_id: parseInt(labId),
                        pc_id: pcId ? parseInt(pcId) : null,
                        start_time: new Date(startTime).toISOString(),
                        end_time: new Date(endTime).toISOString(),
                        task_type: taskType,
                        software_required: software,
                        notes: purpose.trim()
                    };

                    const res = await fetch('/api/reservations/advance', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify(payload)
                    });

                    const data = await res.json();
                    if (res.ok) {
                        notify('success', `Workstation ${data.reservation?.hostname || 'slot'} successfully booked!`);
                        onBookingSuccess();
                    } else {
                        notify('danger', data.detail || "Booking failed.");
                    }
                } catch(err) {
                    notify('danger', "Network error submitting booking.");
                } finally {
                    setSubmitting(false);
                }
            };

            const toggleSoftware = (sw) => {
                if (software.includes(sw)) {
                    setSoftware(software.filter(s => s !== sw));
                } else {
                    setSoftware([...software, sw]);
                }
            };

            return (
                <div className="card" style={{ maxWidth: '800px', margin: '0 auto' }}>
                    <div className="card-header">
                        <div>
                            <h2 className="card-title">Book a Laboratory Workstation</h2>
                            <p className="card-subtitle">Reserve a workstation ahead of time for coursework, projects, or practice.</p>
                        </div>
                    </div>

                    <form onSubmit={handleSubmit}>
                        <div className="form-grid">
                            <div className="form-group">
                                <label>Target Computer Lab</label>
                                <select value={labId} onChange={e => { setLabId(e.target.value); setPcId(''); }}>
                                    {labs.map(l => (
                                        <option key={l.id} value={l.id}>{l.name} ({l.total_pcs} PCs)</option>
                                    ))}
                                </select>
                            </div>

                            <div className="form-group">
                                <label>Workstation Selection</label>
                                <select value={pcId} onChange={e => setPcId(e.target.value)}>
                                    <option value="">Auto-Assign Any Free PC (Recommended)</option>
                                    {labPcs.map(p => (
                                        <option key={p.id} value={p.id}>
                                            {p.hostname} &bull; {p.state}
                                        </option>
                                    ))}
                                </select>
                            </div>

                            <div className="form-group">
                                <label>Start Time</label>
                                <input
                                    type="datetime-local"
                                    value={startTime}
                                    onChange={e => setStartTime(e.target.value)}
                                    required
                                />
                            </div>

                            <div className="form-group">
                                <label>End Time</label>
                                <input
                                    type="datetime-local"
                                    value={endTime}
                                    onChange={e => setEndTime(e.target.value)}
                                    required
                                />
                            </div>
                        </div>

                        <div className="form-group" style={{ marginBottom: '1.25rem' }}>
                            <label>Purpose / Reason for Reservation *</label>
                            <input
                                type="text"
                                placeholder="e.g. Operating Systems Assignment, Final Year AI Project, Python Coding Practice"
                                value={purpose}
                                onChange={e => setPurpose(e.target.value)}
                                required
                            />
                            <span style={{ fontSize: '0.75rem', color: '#64748b' }}>
                                This reason will be displayed on the workstation kiosk screen and live grid.
                            </span>
                        </div>

                        <div className="form-group" style={{ marginBottom: '1.5rem' }}>
                            <label>Software Packages Required</label>
                            <div style={{ display: 'flex', gap: '0.75rem', flexWrap: 'wrap', marginTop: '0.25rem' }}>
                                {['VS Code', 'Docker Engine', 'PyTorch / CUDA', 'MATLAB', 'GCC Compiler'].map(sw => (
                                    <label key={sw} style={{ display: 'inline-flex', alignItems: 'center', gap: '0.35rem', fontSize: '0.85rem', cursor: 'pointer', fontWeight: 400 }}>
                                        <input
                                            type="checkbox"
                                            checked={software.includes(sw)}
                                            onChange={() => toggleSoftware(sw)}
                                        />
                                        {sw}
                                    </label>
                                ))}
                            </div>
                        </div>

                        <div style={{ display: 'flex', justifyContent: 'flex-end', gap: '0.75rem' }}>
                            <button type="submit" className="btn" disabled={submitting}>
                                {submitting ? 'Allocating...' : 'Confirm Reservation'}
                            </button>
                        </div>
                    </form>
                </div>
            );
        }

        /* TAB 3: MY RESERVATIONS */
        function TabMyReservations({ token, currentUser, reservations, loading, setActiveTab, onCancel, onRefresh, openLogin }) {
            if (!token || !currentUser) {
                return (
                    <div className="card" style={{ textAlign: 'center', padding: '3.5rem 2rem' }}>
                        <div style={{ fontSize: '2.5rem', marginBottom: '0.75rem' }}>🔒</div>
                        <h2 className="card-title" style={{ marginBottom: '0.5rem' }}>Authentication Required</h2>
                        <p className="card-subtitle" style={{ maxWidth: '480px', margin: '0 auto 1.5rem auto' }}>
                            Please sign in with your student account to view or manage your personal workstation bookings.
                        </p>
                        <button className="btn" onClick={openLogin}>Sign In to LabTrack</button>
                    </div>
                );

            if (currentUser && currentUser.role === 'faculty') {
                return (
                    <div className="card" style={{ textAlign: 'center', padding: '3.5rem 2rem' }}>
                        <div style={{ fontSize: '2.5rem', marginBottom: '0.75rem' }}>👨‍🏫</div>
                        <h2 className="card-title" style={{ marginBottom: '0.5rem' }}>Personal Workstation Reservations</h2>
                        <p className="card-subtitle" style={{ maxWidth: '520px', margin: '0 auto 1.5rem auto' }}>
                            Individual workstation reservations are for students. To view or conclude scheduled cohort practical lab sessions, visit the Faculty Extra Labs tab.
                        </p>
                        <button className="btn" onClick={() => setActiveTab && setActiveTab('faculty')}>Open Faculty Extra Labs</button>

            const activeRes = reservations.filter(r => r.status === 'HELD' || r.status === 'PENDING').length;
            const pastRes = reservations.filter(r => r.status !== 'HELD' && r.status !== 'PENDING').length;

            return (

                            <div className="stat-card">
                                <div className="stat-header">
                                    <span className="stat-tag stat-tag-avail">🟢 COMPLETED / PAST</span>
                                    <span className="stat-pct">{pastRes} RECORDED</span>
                                </div>
                                <div className="stat-value">{pastRes}<span className="stat-unit">Sessions</span></div>
                                <div className="stat-desc">Concluded academic workstation sessions</div>
                            </div>

                            <div className="stat-card">
                                <div className="stat-header">
                                    <span className="stat-tag">● TOTAL ALLOCATIONS</span>
                                    <span className="stat-pct">LIFETIME</span>
                                </div>
                                <div className="stat-value">{reservations.length}<span className="stat-unit">Total</span></div>
                                <div className="stat-desc">Workstation slots reserved by your account</div>
                            </div>
                        </div>
                    )}

                    <div className="card">
                        <div className="card-header">
                        <div>
                            <h2 className="card-title">My Workstation Bookings</h2>
                            <p className="card-subtitle">Personal reservations linked exclusively to student account ({currentUser.roll_no}).</p>
                        </div>
                        <button className="btn btn-outline btn-sm" onClick={onRefresh}>🔄 Refresh</button>
                    </div>

                    {loading ? (
                        <div style={{ padding: '2rem', textAlign: 'center', color: '#64748b' }}>Loading your reservations...</div>
                    ) : reservations.length === 0 ? (
                        <div style={{ padding: '2.5rem', textAlign: 'center', color: '#64748b' }}>
                            You do not have any active or scheduled workstation bookings.
                        </div>
                    ) : (
                        <div className="table-wrap">
                            <table>
                                <thead>
                                    <tr>
                                        <th># ID</th>
                                        <th>Workstation</th>
                                        <th>Laboratory</th>
                                        <th>Scheduled Time</th>
                                        <th>Purpose / Reason</th>
                                        <th>Status</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {reservations.map(r => {
                                        const startTimeStr = new Date(r.start_time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                                        const endTimeStr = new Date(r.end_time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                                        const dateStr = new Date(r.start_time).toLocaleDateString([], { month: 'short', day: 'numeric' });

                                        return (
                                            <tr key={r.id}>
                                                <td><strong>#{r.id}</strong></td>
                                                <td><strong>{r.hostname}</strong></td>
                                                <td>{r.lab_name}</td>
                                                <td>{dateStr}, {startTimeStr} - {endTimeStr}</td>
                                                <td>{r.purpose || r.notes || r.task_type}</td>
                                                <td><span className={`status-badge badge-${r.status}`}>{r.status}</span></td>
                                                <td>
                                                    {(r.status === 'PENDING' || r.status === 'HELD') ? (
                                                        <button
                                                            className="btn btn-danger btn-sm"
                                                            onClick={() => onCancel(r.id)}
                                                        >
                                                            Cancel
                                                        </button>
                                                    ) : (
                                                        <span style={{ color: '#94a3b8' }}>-</span>

                                </tbody>

                    )}

            </div>
        );
        }

        /* TAB 4: FACULTY COHORT LAB ALLOCATION */
        function TabFaculty({ token, currentUser, labs, sessions, onRefresh, notify, openLogin, onBookingSuccess, onViewSessions }) {
            if (!token || !currentUser || (currentUser.role !== 'faculty' && currentUser.role !== 'admin')) {
                return (
                    <div className="card" style={{ textAlign: 'center', padding: '3.5rem 2rem' }}>
                        <div style={{ fontSize: '2rem', marginBottom: '0.75rem', color: 'var(--text-muted)' }}>🏛️</div>
                        <h2 className="card-title" style={{ marginBottom: '0.5rem' }}>Faculty Privileges Required</h2>
                        <p className="card-subtitle" style={{ maxWidth: '480px', margin: '0 auto 1.5rem auto' }}>
                            Please sign in with an academic faculty or laboratory administrator account to dispatch cohort workstation allocations.
                        </p>
                        <button className="btn" onClick={openLogin}>Sign In as Faculty</button>
                    </div>
                );
            }

            const [courseName, setCourseName] = useState('Operating Systems Practical Lab');
            const [batchName, setBatchName] = useState('3rd Year CSE - Section A & B');
            const [studentCount, setStudentCount] = useState(45);
            const [allocationStrategy, setAllocationStrategy] = useState('SEQUENTIAL'); // 'SEQUENTIAL' | 'BALANCED'
            const [preferredLabId, setPreferredLabId] = useState(1);

            const getInitialStart = () => {
                const d = new Date(Date.now() + 15 * 60000);
                d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
                return d.toISOString().slice(0, 16);
            };
            const getInitialEnd = () => {
                const d = new Date(Date.now() + 135 * 60000);
                d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
                return d.toISOString().slice(0, 16);
            };

            const [startTime, setStartTime] = useState(getInitialStart);
            const [endTime, setEndTime] = useState(getInitialEnd);
            const [submitting, setSubmitting] = useState(false);

            const PRESET_STRENGTHS = [
                { label: '30 PCs', val: 30 },
                { label: '45 PCs', val: 45 },
                { label: '60 PCs', val: 60 },
                { label: '107 PCs (Full)', val: 107 }
            ];

            const setDurationHours = (hours) => {
                try {
                    const startDt = new Date(startTime);
                    const endDt = new Date(startDt.getTime() + hours * 3600000);
                    endDt.setMinutes(endDt.getMinutes() - endDt.getTimezoneOffset());
                    setEndTime(endDt.toISOString().slice(0, 16));
                } catch(e) {}
            };

            // Live visual distribution calculator
            const getPartitionPreview = () => {
                const count = parseInt(studentCount) || 0;
                if (!labs || labs.length === 0) return { breakdown: [], totalAllocated: 0, totalSpare: 0 };

                const orderedLabs = [...labs].sort((a, b) => {
                    if (a.id === parseInt(preferredLabId)) return -1;
                    if (b.id === parseInt(preferredLabId)) return 1;
                    return a.id - b.id;
                });

                if (allocationStrategy === 'BALANCED') {
                    let chosen = [];
                    let capSum = 0;
                    for (const l of orderedLabs) {
                        chosen.push(l);
                        capSum += (l.total_pcs || l.capacity || 0);
                        if (capSum >= count) break;
                    }

                    const allocMap = {};
                    chosen.forEach(l => allocMap[l.id] = 0);
                    let rem = count;

                    while (rem > 0) {
                        const eligible = chosen.filter(l => allocMap[l.id] < (l.total_pcs || l.capacity || 0));
                        if (eligible.length === 0) break;
                        const minVal = Math.min(...eligible.map(l => allocMap[l.id]));
                        for (const l of eligible) {
                            if (allocMap[l.id] === minVal && rem > 0) {
                                allocMap[l.id]++;
                                rem--;
                            }
                        }
                    }

                    const breakdown = orderedLabs.map(l => {
                        const cap = (l.total_pcs || l.capacity || 0);
                        const alloc = allocMap[l.id] || 0;
                        return {
                            id: l.id,
                            name: l.name,
                            total: cap,
                            allocated: alloc,
                            spare: cap - alloc,
                            pctAlloc: cap > 0 ? (alloc / cap) * 100 : 0
                        };
                    });

                    const totalAllocated = Object.values(allocMap).reduce((a, b) => a + b, 0);
                    const totalSpare = breakdown.reduce((a, b) => a + b.spare, 0);
                    return { breakdown, totalAllocated, totalSpare };
                } else {
                    let rem = count;
                    let totalAlloc = 0;
                    const breakdown = orderedLabs.map(l => {
                        const cap = (l.total_pcs || l.capacity || 0);
                        const alloc = Math.min(rem, cap);
                        rem = Math.max(0, rem - alloc);
                        totalAlloc += alloc;
                        return {
                            id: l.id,
                            name: l.name,
                            total: cap,
                            allocated: alloc,
                            spare: cap - alloc,
                            pctAlloc: cap > 0 ? (alloc / cap) * 100 : 0
                        };
                    });
                    const totalSpare = breakdown.reduce((a, b) => a + b.spare, 0);
                    return { breakdown, totalAllocated: totalAlloc, totalSpare };
                }
            };

            const preview = getPartitionPreview();
            const campusTotalPcs = labs.reduce((sum, l) => sum + (l.total_pcs || l.capacity || 0), 0);
            const activeSessions = sessions.filter(s => s.status === 'HELD' || s.status === 'ACTIVE' || s.status === 'PENDING');
            const activeSessionCount = activeSessions.length;
            const totalHeldPcs = activeSessions.reduce((acc, s) => acc + (s.workstation_count || 0), 0);
            const spareCampusPcs = Math.max(0, campusTotalPcs - totalHeldPcs);
            const heldPct = campusTotalPcs > 0 ? Math.round((totalHeldPcs / campusTotalPcs) * 100) : 0;

            useEffect(() => {
                if (window.anime) {
                    window.anime({
                        targets: '.stat-card',
                        translateY: [8, 0],
                        opacity: [0, 1],
                        delay: window.anime.stagger(15),
                        duration: 250,
                        easing: 'easeOutQuad'
                    });
                }
            }, [sessions.length]);

            const handleReserveExtraLab = async (e) => {
                if (e && e.preventDefault) e.preventDefault();
                setSubmitting(true);
                try {
                    const payload = {
                        course_name: courseName.trim(),
                        batch_name: batchName.trim(),
                        student_count: parseInt(studentCount),
                        allocation_strategy: allocationStrategy,
                        preferred_lab_id: parseInt(preferredLabId),
                        start_time: new Date(startTime).toISOString(),
                        end_time: new Date(endTime).toISOString(),
                        notes: `Faculty Practical Lab: ${courseName.trim()} (${batchName.trim()})`
                    };

                    const res = await fetch('/api/faculty/reserve-extra-lab', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify(payload)
                    });

                    const data = await res.json();
                    if (res.ok) {
                        notify('success', data.message || "Extra practical lab session scheduled successfully!");
                        onRefresh();
                        if (onBookingSuccess) onBookingSuccess();
                    } else {
                        notify('danger', data.detail || "Failed to reserve faculty lab.");
                    }
                } catch(e) {
                    notify('danger', "Network error submitting faculty reservation.");
                } finally {
                    setSubmitting(false);
                }
            };

            return (
                <div>
                    {/* Coconut UI & bklit UI Statistical Command Strip for Faculty */}
                    <div className="stats-grid">
                        <div className="stat-card">
                            <div className="stat-header">
                                <span className="stat-tag stat-tag-info">ACTIVE COHORTS</span>
                                <span className="stat-pct">{sessions.length} TOTAL</span>
                            </div>
                            <div className="stat-value">{activeSessionCount}<span className="stat-unit">Batches</span></div>
                            <div className="stat-desc">Scheduled practical sessions in progress</div>
                        </div>

                        <div className="stat-card">
                            <div className="stat-header">
                                <span className="stat-tag stat-tag-held">PRACTICAL ALLOCATIONS</span>
                                <span className="stat-pct">{heldPct}%</span>
                            </div>
                            <div className="stat-value">{totalHeldPcs}<span className="stat-unit">PCs</span></div>
                            <div className="stat-desc">Workstations reserved for enrolled students</div>
                        </div>

                        <div className="stat-card">
                            <div className="stat-header">
                                <span className="stat-tag stat-tag-avail">WALK-IN BUFFER</span>
                                <span className="stat-pct">{100 - heldPct}%</span>
                            </div>
                            <div className="stat-value">{spareCampusPcs}<span className="stat-unit">PCs</span></div>
                            <div className="stat-desc">Campus machines free for general student access</div>
                        </div>

                        <div className="stat-card">
                            <div className="stat-header">
                                <span className="stat-tag">CAMPUS FLEET</span>
                                <span className="stat-pct">{labs.length} LABS</span>
                            </div>
                            <div className="stat-value">{campusTotalPcs}<span className="stat-unit">PCs</span></div>
                            <div className="stat-desc">Total laboratory workstations enrolled</div>
                        </div>
                    </div>

                    {/* 2-COLUMN COHORT SCHEDULING STUDIO */}
                    <div className="faculty-studio-grid">
                        
                        {/* COLUMN 1: SESSION BUILDER FORM */}
                        <div className="card" style={{ marginBottom: 0 }}>
                            <div className="card-header">
                                <div>
                                    <h2 className="card-title">Schedule Practical Lab</h2>
                                    <p className="card-subtitle">Configure cohort parameters and multi-lab overflow distribution.</p>
                                </div>
                                {onViewSessions && (
                                    <button type="button" className="btn btn-outline btn-sm" onClick={onViewSessions}>
                                        View Scheduled Sessions ({sessions.length}) &rarr;
                                    </button>
                                )}
                            </div>

                            <form onSubmit={handleReserveExtraLab} className="studio-form-section">
                                
                                {/* 1. Course & Batch */}
                                <div>
                                    <div className="studio-section-title">1. Course &amp; Cohort Information</div>
                                    <div className="studio-2col-row">
                                        <div className="form-group">
                                            <label>Course / Subject Name *</label>
                                            <input
                                                type="text"
                                                value={courseName}
                                                onChange={e => setCourseName(e.target.value)}
                                                placeholder="e.g. Operating Systems Practical Lab"
                                                required
                                            />
                                        </div>
                                        <div className="form-group">
                                            <label>Student Batch / Cohort *</label>
                                            <input
                                                type="text"
                                                value={batchName}
                                                onChange={e => setBatchName(e.target.value)}
                                                placeholder="e.g. 3rd Year CSE - Section A & B"
                                                required
                                            />
                                        </div>
                                    </div>
                                </div>

                                {/* 2. Student Strength & Presets */}
                                <div>
                                    <div className="studio-section-title" style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
                                        <span>2. Student Strength</span>
                                        <span style={{ color: '#2563eb', fontWeight: 700, fontFamily: 'var(--font-mono)' }}>{studentCount} Students Target</span>
                                    </div>
                                    <div className="form-group">
                                        <input
                                            type="number"
                                            min="1"
                                            max="200"
                                            value={studentCount}
                                            onChange={e => setStudentCount(e.target.value)}
                                            required
                                        />
                                    </div>
                                    <div className="strength-preset-row">
                                        {PRESET_STRENGTHS.map(p => (
                                            <button
                                                key={p.val}
                                                type="button"
                                                className={`strength-pill-btn ${parseInt(studentCount) === p.val ? 'active' : ''}`}
                                                onClick={() => setStudentCount(p.val)}
                                            >
                                                {p.label}
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* 3. Time Window */}
                                <div>
                                    <div className="studio-section-title">3. Scheduled Practical Window</div>
                                    <div className="studio-2col-row">
                                        <div className="form-group">
                                            <label>Start Time *</label>
                                            <input
                                                type="datetime-local"
                                                value={startTime}
                                                onChange={e => setStartTime(e.target.value)}
                                                required
                                            />
                                        </div>
                                        <div className="form-group">
                                            <label>End Time *</label>
                                            <input
                                                type="datetime-local"
                                                value={endTime}
                                                onChange={e => setEndTime(e.target.value)}
                                                required
                                            />
                                        </div>
                                    </div>
                                    <div className="duration-row">
                                        <span style={{ fontSize: '0.72rem', color: 'var(--text-muted)', alignSelf: 'center', fontWeight: 600 }}>Duration:</span>
                                        <button type="button" className="duration-pill-btn" onClick={() => setDurationHours(1)}>+1 Hour</button>
                                        <button type="button" className="duration-pill-btn" onClick={() => setDurationHours(2)}>+2 Hours</button>
                                        <button type="button" className="duration-pill-btn" onClick={() => setDurationHours(3)}>+3 Hours</button>
                                    </div>
