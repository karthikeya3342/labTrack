        /* TAB: SCHEDULED PRACTICAL LAB SESSIONS */
        function TabScheduledSessions({ token, currentUser, labs, sessions, onRefresh, notify, openLogin, onScheduleNew }) {
            if (!token || !currentUser || (currentUser.role !== 'faculty' && currentUser.role !== 'admin')) {
                return (
                    <div className="card" style={{ textAlign: 'center', padding: '3.5rem 2rem' }}>
                        <div style={{ fontSize: '2rem', marginBottom: '0.75rem', color: 'var(--text-muted)' }}>🏛️</div>
                        <h2 className="card-title" style={{ marginBottom: '0.5rem' }}>Faculty Privileges Required</h2>
                        <p className="card-subtitle" style={{ maxWidth: '480px', margin: '0 auto 1.5rem auto' }}>
                            Please sign in with an academic faculty or laboratory administrator account to view practical lab sessions.
                        </p>
                        <button className="btn" onClick={openLogin}>Sign In as Faculty</button>
                    </div>
                );
            }

            const [statusFilter, setStatusFilter] = useState('all'); // 'all' | 'active' | 'completed'
            const [searchQuery, setSearchQuery] = useState('');

            const campusTotalPcs = labs.reduce((sum, l) => sum + (l.total_pcs || l.capacity || 0), 0);
            const activeSessions = sessions.filter(s => s.status === 'HELD' || s.status === 'ACTIVE' || s.status === 'PENDING');
            const concludedSessions = sessions.filter(s => s.status === 'COMPLETED' || s.status === 'CANCELLED');
            const totalHeldPcs = activeSessions.reduce((acc, s) => acc + (s.workstation_count || 0), 0);
            const spareCampusPcs = Math.max(0, campusTotalPcs - totalHeldPcs);
            const heldPct = campusTotalPcs > 0 ? Math.round((totalHeldPcs / campusTotalPcs) * 100) : 0;

            const filteredSessions = sessions.filter(s => {
                const isActive = s.status === 'HELD' || s.status === 'ACTIVE' || s.status === 'PENDING';
                if (statusFilter === 'active' && !isActive) return false;
                if (statusFilter === 'completed' && isActive) return false;
                if (searchQuery.trim()) {
                    const q = searchQuery.toLowerCase().trim();
                    const batchMatch = (s.batch_name || '').toLowerCase().includes(q);
                    const notesMatch = (s.notes || '').toLowerCase().includes(q);
                    const labsMatch = (s.labs_involved || []).some(l => l.toLowerCase().includes(q));
                    if (!batchMatch && !notesMatch && !labsMatch) return false;
                }
                return true;
            });

            const handleEndSession = async (batch) => {
                if (!confirm(`End practical lab session for '${batch}' immediately? All workstations will be restored to AVAILABLE for walk-in students.`)) return;
                try {
                    const res = await fetch('/api/faculty/sessions/end', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ batch_name: batch })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        notify('success', data.message || `Lab session for '${batch}' concluded.`);
                        onRefresh();
                    } else {
                        notify('danger', data.detail || "Failed to conclude lab session.");
                    }
                } catch(e) {
                    notify('danger', "Network error concluding lab session.");
                }
            };

            useEffect(() => {
                if (window.anime) {
                    window.anime({
                        targets: '.stat-card',
                        translateY: [8, 0],
                        opacity: [0, 1],
                        delay: window.anime.stagger(15),
                        duration: 250,
                        easing: 'easeOutQuad'
                    });
                }
            }, [sessions.length]);

            return (
                <div>
                    {/* Statistical Command Strip */}
                    <div className="stats-grid">
                        <div className="stat-card">
                            <div className="stat-header">
                                <span className="stat-tag stat-tag-info">ACTIVE COHORTS</span>
                                <span className="stat-pct">{sessions.length} TOTAL</span>
                            </div>
                            <div className="stat-value">{activeSessions.length}<span className="stat-unit">Batches</span></div>
                            <div className="stat-desc">Scheduled practical sessions currently active or held</div>
                        </div>

                        <div className="stat-card">
                            <div className="stat-header">
                                <span className="stat-tag stat-tag-held">PRACTICAL ALLOCATIONS</span>
                                <span className="stat-pct">{heldPct}%</span>
                            </div>
                            <div className="stat-value">{totalHeldPcs}<span className="stat-unit">PCs</span></div>
                            <div className="stat-desc">Workstations reserved for practical courses</div>
                        </div>

                        <div className="stat-card">
                            <div className="stat-header">
                                <span className="stat-tag stat-tag-avail">WALK-IN BUFFER</span>
                                <span className="stat-pct">{100 - heldPct}%</span>
                            </div>
                            <div className="stat-value">{spareCampusPcs}<span className="stat-unit">PCs</span></div>
                            <div className="stat-desc">Campus machines available for general walk-in access</div>
                        </div>

                        <div className="stat-card">
                            <div className="stat-header">
                                <span className="stat-tag">CAMPUS FLEET</span>
                                <span className="stat-pct">{labs.length} LABS</span>
                            </div>
                            <div className="stat-value">{campusTotalPcs}<span className="stat-unit">PCs</span></div>
                            <div className="stat-desc">Total laboratory workstations enrolled</div>
                        </div>
                    </div>

                    {/* Scheduled Practical Lab Sessions Card */}
                    <div className="card">
                        <div className="card-header">
                            <div>
                                <h2 className="card-title">Scheduled Practical Lab Sessions</h2>
                                <p className="card-subtitle">Cohort sessions booked by faculty with multi-lab allocations and instant release controls.</p>
                            </div>
                            <div style={{ display: 'flex', gap: '0.5rem', alignItems: 'center' }}>
                                <button className="btn btn-outline btn-sm" onClick={onRefresh}>Refresh</button>
                                <button className="btn btn-sm" onClick={onScheduleNew}>+ Schedule Extra Lab</button>
                            </div>
                        </div>

                        {/* Filter Bar */}
                        <div className="admin-filter-bar">
                            <div className="admin-pill-group">
                                <span style={{ fontSize: '0.72rem', color: 'var(--text-muted)', fontWeight: 700, marginRight: '0.2rem' }}>STATUS:</span>
                                <button
                                    className={`admin-pill-btn ${statusFilter === 'all' ? 'active' : ''}`}
                                    onClick={() => setStatusFilter('all')}
                                >
                                    All ({sessions.length})
                                </button>
                                <button
                                    className={`admin-pill-btn ${statusFilter === 'active' ? 'active' : ''}`}
                                    onClick={() => setStatusFilter('active')}
                                >
                                    Active / Held ({activeSessions.length})
                                </button>
                                <button
                                    className={`admin-pill-btn ${statusFilter === 'completed' ? 'active' : ''}`}
                                    onClick={() => setStatusFilter('completed')}
                                >
                                    Concluded ({concludedSessions.length})
                                </button>
                            </div>

                            <div className="admin-search-box">
                                <input
                                    type="text"
                                    className="admin-search-input"
                                    placeholder="Search batch or course..."
                                    value={searchQuery}
                                    onChange={e => setSearchQuery(e.target.value)}
                                />
                            </div>
                        </div>

                        {filteredSessions.length === 0 ? (
                            <div style={{ padding: '3rem 1.5rem', textAlign: 'center', color: '#64748b' }}>
                                <div style={{ fontSize: '1.8rem', marginBottom: '0.5rem' }}>📋</div>
                                <div style={{ fontWeight: 600, color: 'var(--text-main)', marginBottom: '0.25rem' }}>No practical lab sessions found</div>
                                <p style={{ fontSize: '0.82rem', maxWidth: '380px', margin: '0 auto 1.25rem auto' }}>
                                    {sessions.length === 0 ? "No cohort practical lab sessions have been scheduled yet." : "No sessions match the selected filter criteria."}
                                </p>
                                <button className="btn btn-sm" onClick={onScheduleNew}>Schedule Practical Lab Now</button>
                            </div>
                        ) : (
                            <div className="table-wrap">
                                <table>
                                    <thead>
                                        <tr>
                                            <th>Batch / Cohort</th>
                                            <th>Subject / Notes</th>
                                            <th>Allocated Workstations</th>
                                            <th>Labs Involved</th>
                                            <th>Scheduled Window</th>
                                            <th>Status</th>
                                            <th>Operational Action</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {filteredSessions.map((s, idx) => {
                                            const isActiveOrHeld = s.status === 'HELD' || s.status === 'PENDING' || s.status === 'ACTIVE';
                                            return (
                                                <tr key={idx}>
                                                    <td>
                                                        <strong>{s.batch_name}</strong>
                                                    </td>
                                                    <td>{s.notes ? s.notes.replace(/^Faculty Extra Lab:\s*/, '') : 'Practical Lab'}</td>
                                                    <td><span className="mono-count-pill">{s.workstation_count} PCs</span></td>
                                                    <td>
                                                        <div style={{ display: 'flex', gap: '0.35rem', flexWrap: 'wrap' }}>
                                                            {(s.labs_involved || []).map((lName, lIdx) => (
                                                                <span key={lIdx} className="lab-chip-tag">{lName}</span>
                                                            ))}
                                                        </div>
                                                    </td>
                                                    <td>
                                                        <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.8rem' }}>
                                                            {new Date(s.start_time).toLocaleDateString([], { month: 'short', day: 'numeric' })}
                                                        </div>
                                                        <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.74rem', color: 'var(--text-muted)' }}>
                                                            {new Date(s.start_time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} - {new Date(s.end_time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                                                        </div>
                                                    </td>
                                                    <td><span className={`status-badge badge-${s.status}`}>{s.status}</span></td>
                                                    <td>
                                                        {isActiveOrHeld ? (
                                                            <button
                                                                className="btn btn-danger btn-sm"
                                                                onClick={() => handleEndSession(s.batch_name)}
                                                            >
                                                                End Session
                                                            </button>
                                                        ) : (
                                                            <span style={{ color: '#94a3b8', fontSize: '0.8rem', fontStyle: 'italic' }}>Concluded</span>
                                                        )}
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        /* TAB 5: TECHNICAL CLUBS */
        function TabClubs({ token, currentUser, clubs, events, labs, onRefresh, notify, openLogin }) {
            const [clubId, setClubId] = useState(1);
            const [title, setTitle] = useState('Intro to Development Workshop');
            const [attendees, setAttendees] = useState(40);
            const [preferredLabId, setPreferredLabId] = useState(1);
            const [selectedEventRoster, setSelectedEventRoster] = useState(null);
            const [loadingRoster, setLoadingRoster] = useState(false);
            const [rosterData, setRosterData] = useState(null);

            const getInitialStart = () => {
                const d = new Date(Date.now() + 5 * 60000);
                d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
                return d.toISOString().slice(0, 16);
            };
            const getInitialEnd = () => {
                const d = new Date(Date.now() + 65 * 60000);
                d.setMinutes(d.getMinutes() - d.getTimezoneOffset());
                return d.toISOString().slice(0, 16);
            };

            const [startTime, setStartTime] = useState(getInitialStart);
            const [endTime, setEndTime] = useState(getInitialEnd);
            const [submitting, setSubmitting] = useState(false);

            const handleStartTimeChange = (val) => {
                setStartTime(val);
                const s = new Date(val);
                const e = new Date(endTime);
                if (isNaN(e.getTime()) || e <= s) {
                    const nextEnd = new Date(s.getTime() + 60 * 60000);
                    nextEnd.setMinutes(nextEnd.getMinutes() - nextEnd.getTimezoneOffset());
                    setEndTime(nextEnd.toISOString().slice(0, 16));
                }
            };

            const fetchRoster = async (eventId, evTitle) => {
                setLoadingRoster(true);
                setSelectedEventRoster({ id: eventId, title: evTitle });
                try {
                    const res = await fetch(`/api/clubs/events/${eventId}/roster`);
                    if (res.ok) {
                        const data = await res.json();
                        setRosterData(data);
                    } else {
                        notify('danger', 'Failed to load participant roster.');
                    }
                } catch(e) {
                    notify('danger', 'Network error loading roster.');
                } finally {
                    setLoadingRoster(false);
                }
            };

            const handleProposeEvent = async (e) => {
                e.preventDefault();
                setSubmitting(true);
                try {
                    const payload = {
                        club_id: parseInt(clubId),
                        title: title.trim(),
                        expected_attendees: parseInt(attendees),
                        preferred_lab_id: parseInt(preferredLabId),
                        lab_id: parseInt(preferredLabId),
                        start_time: new Date(startTime).toISOString(),
                        end_time: new Date(endTime).toISOString(),
                        description: `Technical Workshop conducted by student coding club.`,
                        auto_approve: currentUser && currentUser.role === 'admin'
                    };

                    const res = await fetch('/api/clubs/events', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify(payload)
                    });

                    const data = await res.json();
                    if (res.ok) {
                        notify('success', data.message || "Club event submitted successfully!");
                        onRefresh();
                    } else {
                        notify('danger', data.detail || "Submission failed.");
                    }
                } catch(e) {
                    notify('danger', "Network error submitting club event.");
                } finally {
                    setSubmitting(false);
                }
            };

            const handleEndEvent = async (eventId, evTitle) => {
                if (!confirm(`End club event '${evTitle}' immediately? All workstations will be freed and returned to normal walk-in kiosk screen.`)) return;
                try {
                    const res = await fetch(`/api/clubs/events/${eventId}/end`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await res.json();
                    if (res.ok) {
                        notify('success', data.message || `Event #${eventId} ended successfully!`);
                        onRefresh();
                    } else {
                        notify('danger', data.detail || "Failed to end event.");
                    }
                } catch(e) {
                    notify('danger', "Network error ending event.");
                }
            };

            const approvedCount = events.filter(e => e.status === 'APPROVED').length;
            const pendingCount = events.filter(e => e.status === 'PENDING').length;
            const totalAttendees = events.reduce((sum, e) => sum + (e.expected_attendees || 0), 0);

            useEffect(() => {
                if (window.anime) {
                    window.anime({
                        targets: '.stat-card',
                        translateY: [8, 0],
                        opacity: [0, 1],
                        delay: window.anime.stagger(15),
                        duration: 250,
                        easing: 'easeOutQuad'
                    });
                }
            }, [events.length]);

            return (
                <div>
                    {/* Coconut UI & bklit UI Statistical Command Strip for Clubs */}
                    <div className="stats-grid">
                        <div className="stat-card">
                            <div className="stat-header">
                                <span className="stat-tag stat-tag-info">● REGISTERED CLUBS</span>
                                <span className="stat-pct">{clubs.length} ACTIVE</span>
                            </div>
                            <div className="stat-value">{clubs.length}<span className="stat-unit">Clubs</span></div>
                            <div className="stat-desc">IIITDM Kurnool student technical bodies</div>
                        </div>

                        <div className="stat-card">
                            <div className="stat-header">
                                <span className="stat-tag stat-tag-avail">🟢 APPROVED WORKSHOPS</span>
                                <span className="stat-pct">{approvedCount} ACTIVE</span>
                            </div>
                            <div className="stat-value">{approvedCount}<span className="stat-unit">Events</span></div>
                            <div className="stat-desc">Scheduled hands-on laboratory workshops</div>
                        </div>

                        <div className="stat-card">
                            <div className="stat-header">
                                <span className="stat-tag stat-tag-held">🔒 PENDING REVIEW</span>
                                <span className="stat-pct">{pendingCount} QUEUED</span>
                            </div>
                            <div className="stat-value">{pendingCount}<span className="stat-unit">Proposals</span></div>
                            <div className="stat-desc">Awaiting administrator room allocation</div>
                        </div>

                        <div className="stat-card">
                            <div className="stat-header">
                                <span className="stat-tag">● ENGAGEMENT</span>
                                <span className="stat-pct">{events.length} TOTAL</span>
                            </div>
                            <div className="stat-value">{totalAttendees}<span className="stat-unit">Students</span></div>
                            <div className="stat-desc">Expected participant registrations across events</div>
                        </div>
                    </div>

                    <div className="card">
                        <div className="card-header">
                            <div>
                                <h2 className="card-title">Technical Clubs Lab Allocation</h2>
                                <p className="card-subtitle">
                                    Official college clubs (GDG, BitSquad, DataWorks, Electronix, CAD &amp; Robotics) can submit event booking requests. Upon admin approval, workstations display the club's banner and event title on the kiosk screen.
                                </p>
                            </div>
                        </div>

                        <form onSubmit={handleProposeEvent}>
                            <div className="form-grid">
                                <div className="form-group">
                                    <label>Technical Club</label>
                                    <select value={clubId} onChange={e => setClubId(e.target.value)}>
                                        {clubs.map(c => (
                                            <option key={c.id} value={c.id}>{c.name} ({c.lead_name || 'Lead'})</option>
                                        ))}
                                    </select>
                                </div>

                                <div className="form-group">
                                    <label>Event / Workshop Title *</label>
                                    <input
                                        type="text"
                                        value={title}
                                        onChange={e => setTitle(e.target.value)}
                                        required
                                    />
                                </div>

                                <div className="form-group">
                                    <label>Expected Attendees</label>
                                    <input
                                        type="number"
                                        min="5"
                                        max="90"
                                        value={attendees}
                                        onChange={e => setAttendees(e.target.value)}
                                        required
                                    />
                                </div>

                                <div className="form-group">
                                    <label>Preferred Laboratory</label>
                                    <select value={preferredLabId} onChange={e => setPreferredLabId(e.target.value)}>
                                        {labs.map(l => (
                                            <option key={l.id} value={l.id}>{l.name}</option>
                                        ))}
                                    </select>
                                </div>

                                <div className="form-group">

        /* TAB 6: ADMIN OPERATIONS */
        function TabAdmin({ token, events, workstations, onRefresh, notify }) {
            const pendingEvents = events.filter(e => e.status === 'PENDING');
            const approvedEvents = events.filter(e => e.status === 'APPROVED');
            const [selectedEventRoster, setSelectedEventRoster] = useState(null);
            const [loadingRoster, setLoadingRoster] = useState(false);
            const [rosterData, setRosterData] = useState(null);

            // Admin tab & fleet filter states
            const [eventTab, setEventTab] = useState('pending'); // 'pending' | 'active'
            const [selectedLabFilter, setSelectedLabFilter] = useState('all');
            const [pcStateFilter, setPcStateFilter] = useState('all'); // 'all' | 'OPERATIONAL' | 'MAINTENANCE'
            const [searchQuery, setSearchQuery] = useState('');

            const fetchRoster = async (eventId, evTitle) => {
                setLoadingRoster(true);
                setSelectedEventRoster({ id: eventId, title: evTitle });
                try {
                    const res = await fetch(`/api/clubs/events/${eventId}/roster`);
                    if (res.ok) {
                        const data = await res.json();
                        setRosterData(data);
                    } else {
                        notify('danger', 'Failed to load participant roster.');
                    }
                } catch(e) {
                    notify('danger', 'Network error loading roster.');
                } finally {
                    setLoadingRoster(false);
                }
            };

            const handleReleaseAll = async () => {
                if (!confirm("🚨 MASTER SYSTEM RESET:\n\nAre you sure you want to release ALL workstation holds, terminate active student sessions, conclude all club and faculty sessions, and return ALL campus workstations to AVAILABLE walk-in mode?")) return;
                try {
                    const res = await fetch('/api/admin/system/release-all', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await res.json();
                    if (res.ok) {
                        notify('success', data.message || "All workstations successfully restored to AVAILABLE!");
                        onRefresh();
                    } else {
                        notify('danger', data.detail || "Release failed.");
                    }
                } catch(e) {
                    notify('danger', "Network error triggering release-all.");
                }
            };

            const approveEvent = async (id) => {
                try {
                    const res = await fetch(`/api/admin/club-events/${id}/approve`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ admin_notes: "Approved by lab administrator" })
                    });
                    if (res.ok) {
                        notify('success', `Event #${id} approved successfully!`);
                        onRefresh();
                    } else {
                        const err = await res.json();
                        notify('danger', err.detail || "Approval failed");
                    }
                } catch(e) {
                    notify('danger', "Network error");
                }
            };

            const rejectEvent = async (id) => {
                const reason = prompt("Enter rejection reason:", "Lab unavailable / schedule conflict");
                if (reason === null) return;
                try {
                    const res = await fetch(`/api/admin/club-events/${id}/reject`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({ admin_notes: reason })
                    });
                    if (res.ok) {
                        notify('info', `Event #${id} rejected.`);
                        onRefresh();
                    }
                } catch(e) {
                    notify('danger', "Network error rejecting event.");
                }
            };

            const endClubEvent = async (id, title) => {
                if (!confirm(`End event '${title}' immediately? All workstations will return to normal walk-in kiosk mode.`)) return;
                try {
                    const res = await fetch(`/api/clubs/events/${id}/end`, {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` }
                    });
                    const data = await res.json();
                    if (res.ok) {
                        notify('success', data.message || `Event #${id} ended.`);
                        onRefresh();
                    } else {
                        notify('danger', data.detail || "Failed to end event.");
                    }
                } catch(e) {
                    notify('danger', "Network error");
                }
            };

            const toggleMaintenance = async (pcId, currentMaint) => {
                try {
                    const res = await fetch(`/api/admin/pcs/${pcId}/maintenance`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            is_maintenance: !currentMaint,
                            reason: !currentMaint ? "Hardware Diagnostics & Testing" : null
                        })
                    });
                    if (res.ok) {
                        notify('success', `Workstation maintenance state updated.`);
                        onRefresh();
                    }
                } catch(e) {
                    notify('danger', "Network error updating PC maintenance.");
                }
            };

            const maintPCs = workstations.filter(w => w.state === 'MAINTENANCE');
            const totalPCs = workstations.length;
            const operationalPCs = totalPCs - maintPCs.length;
            const fleetHealthPct = totalPCs > 0 ? Math.round((operationalPCs / totalPCs) * 100) : 100;

            // Unique labs from workstations
            const uniqueLabs = [...new Set(workstations.map(w => w.lab_name).filter(Boolean))];

            // Filtered workstations for maintenance fleet control
            const filteredPCs = workstations.filter(pc => {
                if (selectedLabFilter !== 'all' && pc.lab_name !== selectedLabFilter) return false;
                if (pcStateFilter === 'MAINTENANCE' && pc.state !== 'MAINTENANCE') return false;
                if (pcStateFilter === 'OPERATIONAL' && pc.state === 'MAINTENANCE') return false;
                if (searchQuery.trim()) {
                    const q = searchQuery.toLowerCase().trim();
                    if (!pc.hostname.toLowerCase().includes(q) && !(pc.lab_name || '').toLowerCase().includes(q)) return false;
                }
                return true;
            });

            useEffect(() => {
                if (window.anime) {
                    window.anime({
                        targets: '.stat-card',
                        translateY: [8, 0],
                        opacity: [0, 1],
                        delay: window.anime.stagger(15),
                        duration: 250,
                        easing: 'easeOutQuad'
                    });
                }
            }, [events.length, workstations.length]);

            return (
                <div>
                    {/* Coconut UI & bklit UI Statistical Command Strip for Admin */}
                    <div className="stats-grid">
                        <div className="stat-card">
                            <div className="stat-header">
                                <span className="stat-tag stat-tag-alert">PENDING PROPOSALS</span>
                                <span className="stat-pct">{pendingEvents.length > 0 ? 'ACTION NEEDED' : 'CLEARED'}</span>
                            </div>
                            <div className="stat-value">{pendingEvents.length}<span className="stat-unit">Proposals</span></div>
                            <div className="stat-desc">Student club workshop proposals awaiting review</div>
                        </div>

                        <div className="stat-card">
                            <div className="stat-header">
                                <span className="stat-tag stat-tag-info">ACTIVE WORKSHOPS</span>
                                <span className="stat-pct">{approvedEvents.length} RUNNING</span>
                            </div>
                            <div className="stat-value">{approvedEvents.length}<span className="stat-unit">Approved</span></div>
                            <div className="stat-desc">Currently allocated student club events</div>
                        </div>

                        <div className="stat-card">
                            <div className="stat-header">
                                <span className="stat-tag stat-tag-held">MAINTENANCE LOCKOUTS</span>
                                <span className="stat-pct">{maintPCs.length} OFFLINE</span>
                            </div>
                            <div className="stat-value">{maintPCs.length}<span className="stat-unit">PCs</span></div>
                            <div className="stat-desc">Machines marked for hardware diagnostics</div>
                        </div>

                        <div className="stat-card">
                            <div className="stat-header">
                                <span className="stat-tag stat-tag-avail">FLEET HEALTH</span>
                                <span className="stat-pct">{fleetHealthPct}% ONLINE</span>
                            </div>
                            <div className="stat-value">{operationalPCs}<span className="stat-unit">/{totalPCs} PCs</span></div>

                        </div>

                            <p className="executive-banner-desc">
                                Restores all 45 campus workstations across all laboratories to available walk-in mode, releasing all active student sessions, concluding cohort holds, and resetting machine locks.
                            </p>
                        </div>
                        <button className="btn btn-danger" onClick={handleReleaseAll}>
                            Master Reset Fleet to Walk-in Mode
                        </button>
                    </div>

                    {/* Technical Club Workshops & Proposals Management */}
                    <div className="card">
                        <div className="card-header">
                            <div>
                                <h2 className="card-title">Technical Club Events &amp; Workshop Allocations</h2>
                                <p className="card-subtitle">Review proposals, monitor active club sessions, and inspect student attendance rosters.</p>
                            </div>
                            <div className="segmented-control">
                                <button
                                    className={`segmented-tab-btn ${eventTab === 'pending' ? 'active' : ''}`}
                                    onClick={() => setEventTab('pending')}
                                >
                                    Pending Proposals ({pendingEvents.length})
                                </button>
                                <button
                                    className={`segmented-tab-btn ${eventTab === 'active' ? 'active' : ''}`}
                                    onClick={() => setEventTab('active')}
                                >
                                    Active / Approved ({approvedEvents.length})
                                </button>
                            </div>
                        </div>

                        {eventTab === 'pending' && (
                            pendingEvents.length === 0 ? (
                                <div style={{ padding: '2.5rem', textAlign: 'center', color: '#64748b' }}>
                                    No club proposals currently awaiting administrative approval.
                                </div>
                            ) : (
                                <div className="table-wrap">
                                    <table>
                                        <thead>
                                            <tr>
                                                <th># ID</th>
                                                <th>Club Organization</th>
                                                <th>Event Title</th>
                                                <th>Attendees</th>
                                                <th>Target Lab</th>
                                                <th>Scheduled Window</th>
                                                <th>Review Decision</th>

                                        <tbody>
                                            {pendingEvents.map(e => (

                                                    <td>{e.title}</td>
                                                    <td>{e.expected_attendees} students</td>
                                                    <td><span className="lab-chip-tag">{e.primary_lab_name}</span></td>
                                                    <td>
                                                        <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.8rem' }}>
                                                            {new Date(e.start_time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} - {new Date(e.end_time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                                                        </div>
                                                    </td>

                                                        <div style={{ display: 'flex', gap: '0.4rem' }}>
                                                            <button

                                                                Approve

                                                                onClick={() => rejectEvent(e.id)}

                                                                Reject

                                                        </div>
                                                    </td>
                                                </tr>

                                        </tbody>
                                    </table>
                                </div>
                            )
                        )}

                        {eventTab === 'active' && (
                            approvedEvents.length === 0 ? (
                                <div style={{ padding: '2.5rem', textAlign: 'center', color: '#64748b' }}>
                                    No active or approved club events currently running.

                            ) : (
                                <div className="table-wrap">
                                    <table>
                                        <thead>
                                            <tr>
                                                <th>Club Organization</th>
                                                <th>Event Title</th>
                                                <th>Laboratory</th>
                                                <th>Schedule Window</th>
                                                <th>Status</th>
                                                <th>Operational Controls</th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {approvedEvents.map(e => (
                                                <tr key={e.id}>
                                                    <td><strong>{e.club_name}</strong></td>
                                                    <td>{e.title}</td>
                                                    <td><span className="lab-chip-tag">{e.primary_lab_name}</span></td>
                                                    <td>
                                                        <div style={{ fontFamily: 'var(--font-mono)', fontSize: '0.8rem' }}>
                                                            {new Date(e.start_time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })} - {new Date(e.end_time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}
                                                        </div>
                                                    </td>
                                                    <td><span className="status-badge badge-AVAILABLE">APPROVED</span></td>
                                                    <td>
                                                        <div style={{ display: 'flex', gap: '0.4rem', flexWrap: 'wrap' }}>
                                                            <button
                                                                className="btn btn-outline btn-sm"

                                                                onClick={() => endClubEvent(e.id, e.title)}

                                                                End Workshop

                                                        </div>
                                                    </td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            )
                        )}
                    </div>

                    {/* Participant Attendance Roster Modal */}
                    {selectedEventRoster && (
                        <div className="modal-overlay" onClick={e => { if (e.target.className === 'modal-overlay') setSelectedEventRoster(null); }}>
                            <div className="modal-card" style={{ maxWidth: '850px', width: '90%' }}>
                                <div className="modal-header">
                                    <div>
                                        <h3 className="card-title">Event Participants &amp; Attendance Roster</h3>
                                        <p className="card-subtitle">{selectedEventRoster.title}</p>

                                ) : !rosterData ? (
                                    <div style={{ padding: '2rem', textAlign: 'center', color: '#64748b' }}>Failed to load roster data.</div>
                                ) : (
                                    <div>
                                        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: '1rem', marginBottom: '1.25rem' }}>

                                                <div style={{ fontSize: '0.72rem', color: '#64748b', fontWeight: 700, fontFamily: 'var(--font-mono)' }}>TOTAL ATTENDEES</div>
                                                <div style={{ fontSize: '1.5rem', fontWeight: 800, color: '#0284c7', fontFamily: 'var(--font-mono)' }}>{rosterData.metrics?.total_attendees || 0}</div>
                                            </div>
                                            <div style={{ padding: '0.85rem', background: '#f8fafc', border: '1px solid #e2e8f0', borderRadius: '8px' }}>
                                                <div style={{ fontSize: '0.72rem', color: '#64748b', fontWeight: 700, fontFamily: 'var(--font-mono)' }}>CURRENTLY ACTIVE</div>
                                                <div style={{ fontSize: '1.5rem', fontWeight: 800, color: '#16a34a', fontFamily: 'var(--font-mono)' }}>{rosterData.metrics?.active_now || 0}</div>
                                            </div>
                                            <div style={{ padding: '0.85rem', background: '#f8fafc', border: '1px solid #e2e8f0', borderRadius: '8px' }}>
                                                <div style={{ fontSize: '0.72rem', color: '#64748b', fontWeight: 700, fontFamily: 'var(--font-mono)' }}>ORGANIZATION</div>
                                                <div style={{ fontSize: '1.05rem', fontWeight: 700, color: '#334155' }}>{rosterData.event?.club_name || 'Technical Club'}</div>
                                            </div>
                                        </div>

                                        {(!rosterData.roster || rosterData.roster.length === 0) ? (
                                            <div style={{ padding: '2.5rem 1rem', textAlign: 'center', color: '#64748b', background: '#f8fafc', borderRadius: '8px', border: '1px solid #e2e8f0' }}>
                                                No students have checked into workstations for this event yet.
                                            </div>
                                        ) : (
                                            <div className="table-wrap">
                                                <table>
                                                    <thead>
                                                        <tr>
                                                            <th>Roll Number</th>
                                                            <th>Student Name</th>
                                                            <th>Workstation</th>
                                                            <th>Check-in Time</th>
                                                            <th>Duration</th>
                                                            <th>Status</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {rosterData.roster.map((p, idx) => (
                                                            <tr key={idx}>
                                                                <td><strong>{p.roll_no}</strong></td>
                                                                <td>{p.student_name}</td>
                                                                <td><code>{p.hostname}</code></td>
                                                                <td>{p.checkin_time ? new Date(p.checkin_time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '-'}</td>
                                                                <td>{p.duration_minutes} min</td>
                                                                <td><span className={`status-badge badge-${p.session_status === 'ACTIVE' ? 'AVAILABLE' : 'MAINTENANCE'}`}>{p.session_status}</span></td>
                                                            </tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        )}

                                        <div style={{ display: 'flex', justifyContent: 'flex-end', marginTop: '1.25rem' }}>
                                            <button className="btn" onClick={() => setSelectedEventRoster(null)}>Close</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* Fleet Workstation Hardware Maintenance Controls */}
                    <div className="card">
                        <div className="card-header">
                            <div>
                                <h2 className="card-title">Workstation Hardware Maintenance Controls</h2>
                                <p className="card-subtitle">Filter, search, and toggle individual workstation diagnostic lockouts across campus laboratories.</p>
                            </div>
                            <button className="btn btn-outline btn-sm" onClick={onRefresh}>Refresh Fleet</button>
                        </div>

                        {/* Interactive Filter Bar */}
                        <div className="admin-filter-bar">
                            <div className="admin-pill-group">
                                <span style={{ fontSize: '0.72rem', color: 'var(--text-muted)', fontWeight: 700, marginRight: '0.2rem' }}>LAB:</span>
                                <button
                                    className={`admin-pill-btn ${selectedLabFilter === 'all' ? 'active' : ''}`}
                                    onClick={() => setSelectedLabFilter('all')}
                                >
                                    All Labs ({workstations.length})
                                </button>
                                {uniqueLabs.map(lName => (
                                    <button
                                        key={lName}
                                        className={`admin-pill-btn ${selectedLabFilter === lName ? 'active' : ''}`}
                                        onClick={() => setSelectedLabFilter(lName)}
                                    >
                                        {lName} ({workstations.filter(w => w.lab_name === lName).length})
                                    </button>
                                ))}
                            </div>

                            <div style={{ display: 'flex', gap: '0.75rem', alignItems: 'center', flexWrap: 'wrap' }}>
                                <div className="admin-pill-group">
                                    <span style={{ fontSize: '0.72rem', color: 'var(--text-muted)', fontWeight: 700, marginRight: '0.2rem' }}>STATE:</span>
                                    <button
                                        className={`admin-pill-btn ${pcStateFilter === 'all' ? 'active' : ''}`}
                                        onClick={() => setPcStateFilter('all')}
                                    >
                                        All
                                    </button>
                                    <button
                                        className={`admin-pill-btn ${pcStateFilter === 'OPERATIONAL' ? 'active' : ''}`}
                                        onClick={() => setPcStateFilter('OPERATIONAL')}
                                    >
                                        Online ({operationalPCs})
                                    </button>
                                    <button
                                        className={`admin-pill-btn ${pcStateFilter === 'MAINTENANCE' ? 'active' : ''}`}
                                        onClick={() => setPcStateFilter('MAINTENANCE')}
                                    >
                                        Maintenance ({maintPCs.length})
                                    </button>
                                </div>

                                <div className="admin-search-box">
                                    <input
                                        type="text"
                                        className="admin-search-input"
                                        placeholder="Search hostname..."
                                        value={searchQuery}
                                        onChange={e => setSearchQuery(e.target.value)}
                                    />
                                </div>
                            </div>
                        </div>

                        {/* Full Fleet Table */}
                        <div className="table-wrap">
                            <table>
                                <thead>
                                    <tr>
                                        <th>Workstation Hostname</th>
                                        <th>Campus Laboratory</th>
                                        <th>Current Fleet State</th>
                                        <th>Diagnostics Note</th>
                                        <th>Hardware Dispatch Control</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {filteredPCs.length === 0 ? (
                                        <tr>
                                            <td colSpan="5" style={{ textAlign: 'center', padding: '2rem', color: 'var(--text-muted)' }}>
                                                No workstations match the specified filter criteria.
                                            </td>
                                        </tr>
                                    ) : (
                                        filteredPCs.map(pc => {
                                            const isMaint = pc.state === 'MAINTENANCE';
                                            return (
                                                <tr key={pc.id}>
                                                    <td><span className="mono-count-pill">{pc.hostname}</span></td>
                                                    <td><span className="lab-chip-tag">{pc.lab_name}</span></td>
                                                    <td><span className={`status-badge badge-${pc.state}`}>{pc.state}</span></td>
                                                    <td>
                                                        <span style={{ fontSize: '0.8rem', color: isMaint ? '#991b1b' : 'var(--text-muted)' }}>
                                                            {pc.maintenance_reason || 'Operational - No issues'}
                                                        </span>
                                                    </td>
                                                    <td>
                                                        <button
                                                            className={`btn btn-sm ${isMaint ? 'btn-success' : 'btn-outline'}`}
                                                            onClick={() => toggleMaintenance(pc.id, isMaint)}
                                                        >
                                                            {isMaint ? 'Restore to Service' : 'Set Maintenance'}
                                                        </button>
                                                    </td>
                                                </tr>
                                            );
                                        })
                                    )}
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            );
        }

        /* AUTH MODAL */
        function AuthModal({ onClose, onLoginSuccess, notify }) {
            const [rollNo, setRollNo] = useState('');
            const [password, setPassword] = useState('');
            const [loading, setLoading] = useState(false);

            const handleAuth = async (e) => {
                if (e) e.preventDefault();
                setLoading(true);
                try {
                    const res = await fetch('/api/auth/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ roll_no: rollNo, password: password })
                    });
                    const data = await res.json();
                    if (res.ok) {
                        onLoginSuccess(data.user, data.access_token);
                    } else {
                        notify('danger', data.detail || "Authentication failed");
                    }
                } catch(e) {
                    notify('danger', "Network error connecting to auth server");
                } finally {
                    setLoading(false);
                }
            };

            const quickLogin = (userRoll, pw) => {
                setRollNo(userRoll);
                setPassword(pw);
                setTimeout(async () => {
                    try {
                        const res = await fetch('/api/auth/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ roll_no: userRoll, password: pw })
                        });
                        const data = await res.json();
                        if (res.ok) {
                            onLoginSuccess(data.user, data.access_token);
                        } else {
                            notify('danger', data.detail || "Authentication failed");
                        }
                    } catch(e) {
                        notify('danger', "Network error connecting to auth server");
                    }
                }, 50);
            };

            return (
                <div className="modal-overlay" onClick={e => { if (e.target.className === 'modal-overlay') onClose(); }}>
                    <div className="modal-card">
                        <div className="modal-header">
                            <div>
                                <h3 className="card-title">Sign In to LabTrack</h3>
                                <p className="card-subtitle">Authenticate with roll number or institutional email.</p>
                            </div>
                            <button className="close-btn" onClick={onClose}>&times;</button>
                        </div>

                        {/* Quick Persona Selector for Testing */}
                        <div style={{ marginBottom: '1.25rem' }}>
                            <div style={{ fontSize: '0.78rem', color: '#64748b', fontWeight: 600, marginBottom: '0.4rem' }}>
                                QUICK TEST PERSONAS:
                            </div>
                            <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: '0.5rem' }}>
                                <button type="button" className="quick-user-btn" onClick={() => quickLogin('admin', 'admin123')}>
                                    <strong>⚙️ Administrator</strong><br />admin
                                </button>
                                <button type="button" className="quick-user-btn" onClick={() => quickLogin('faculty01', 'faculty123')}>
                                    <strong>👨‍🏫 Dr. Alan Turing</strong><br />faculty01 (Faculty)
                                </button>
                                <button type="button" className="quick-user-btn" onClick={() => quickLogin('STU001', 'stu123')}>
                                    <strong>🎓 Alice Johnson</strong><br />STU001 (Student)
                                </button>
                                <button type="button" className="quick-user-btn" onClick={() => quickLogin('124cs0021', 'stu123')}>
                                    <strong>🚀 GDG Club Lead</strong><br />124cs0021
                                </button>
                            </div>
                        </div>

                        <form onSubmit={handleAuth}>
                            <div className="form-group" style={{ marginBottom: '1rem' }}>
                                <label>Roll Number or Email</label>
                                <input
                                    type="text"
                                    placeholder="e.g. STU001 or admin@univ.edu"
                                    value={rollNo}
                                    onChange={e => setRollNo(e.target.value)}
                                    required
                                    autoFocus
                                />
                            </div>

                            <div className="form-group" style={{ marginBottom: '1.5rem' }}>
                                <label>Password</label>
                                <input
                                    type="password"
                                    placeholder="Enter password"
                                    value={password}
                                    onChange={e => setPassword(e.target.value)}
                                    required
                                />
                            </div>

                            <button type="submit" className="btn" style={{ width: '100%', justifyContent: 'center' }} disabled={loading}>
                                {loading ? 'Authenticating...' : 'Sign In'}
                            </button>
                        </form>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
