<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LabTrack - Dev State Preview Harness & Design Gallery</title>
    <link rel="stylesheet" href="/static/css/tokens.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/workstation.css">
    <link rel="stylesheet" href="/static/css/portal.css">
    <script src="/static/js/icons.js"></script>
    <style>
        .dev-harness-bar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 48px;
            background: #09090b;
            border-bottom: 1px solid #27272a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.25rem;
            z-index: 99999;
            color: #f4f4f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 0.85rem;
        }
        .dev-harness-title {
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: #38bdf8;
        }
        .dev-harness-selector {
            display: flex;
            gap: 0.4rem;
            overflow-x: auto;
            max-width: 80%;
            padding: 4px 0;
        }
        .dev-btn {
            background: #18181b;
            color: #a1a1aa;
            border: 1px solid #27272a;
            padding: 0.25rem 0.65rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s ease;
        }
        .dev-btn:hover {
            color: #ffffff;
            border-color: #3f3f46;
        }
        .dev-btn.active {
            background: #2563eb;
            color: #ffffff;
            border-color: #3b82f6;
        }
        .dev-stage {
            margin-top: 48px;
            min-height: calc(100vh - 48px);
            position: relative;
        }
        .dev-modal-overlay {
            position: fixed;
            top: 48px;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.65);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 1.5rem;
        }
    </style>
</head>
<body>

    <!-- TOP HARNESS NAV -->
    <header class="dev-harness-bar">
        <h1 class="sr-only">LabTrack Dev State Gallery</h1>
        <div class="dev-harness-title">
            <span>LabTrack State Gallery</span>
        </div>
        <div class="dev-harness-selector">
            <button class="dev-btn active" onclick="showState('kiosk-available')">1. Available</button>
            <button class="dev-btn" onclick="showState('kiosk-held-personal')">2. Held: Personal</button>
            <button class="dev-btn" onclick="showState('kiosk-held-dedicated')">3. Held: Dedicated</button>
            <button class="dev-btn" onclick="showState('kiosk-held-faculty')">4. Held: Faculty</button>
            <button class="dev-btn" onclick="showState('kiosk-held-club')">5. Held: Club Takeover</button>
            <button class="dev-btn" onclick="showState('kiosk-occupied')">6. Active Session</button>
            <button class="dev-btn" onclick="showState('kiosk-maintenance')">7. Maintenance</button>
            <button class="dev-btn" onclick="showState('kiosk-access-denied')">8. Access Denied</button>
            <button class="dev-btn" onclick="showState('kiosk-hud')">9. Desktop HUD</button>
            <button class="dev-btn" onclick="showState('modal-reserve')">10. Modal: Reserve</button>
            <button class="dev-btn" onclick="showState('modal-extend')">11. Modal: Extend</button>
            <button class="dev-btn" onclick="showState('modal-conflict')">12. Modal: 409 Conflict</button>
            <button class="dev-btn" onclick="showState('modal-reset')">13. Destructive Reset</button>
        </div>
    </header>

    <!-- MAIN DISPLAY STAGE -->
    <main class="dev-stage" id="devStage" role="main">
        <!-- Content will be rendered dynamically based on selected state -->
